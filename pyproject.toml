[project]
name = "alealami-trading-api"
version = "0.1.0"
description = "Al Ealami Trading — Django CMS API"
requires-python = ">=3.12"
dependencies = [
    "django>=4.2,<5",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.3",
    "pillow>=10.0",
    "psycopg2-binary>=2.9",
    "whitenoise>=6.6",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "config.wsgi:application"

[tool.vercel.scripts]
build = "python build_vercel.py"
